<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Medistock</title>
    <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
    <h2>Iniciar Sesión</h2>
    <form id="formulario-login">
        <input type="email" id="log-correo" placeholder="Correo electrónico" required>
        <input type="password" id="log-contrasena" placeholder="Contraseña" required>
        <button type="submit">Entrar</button>
    </form>
    <p id="mensaje-error-log" style="color: red;"></p>

    <script type="module" src="./login.js"></script>
</body>
</html>
